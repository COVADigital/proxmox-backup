services:
  pbs:
    hostname: ${PBS_HOSTNAME:-pbs}
    image: ${PBS_IMAGE:-dockurr/proxmox-backup}

    environment:
      TZ: ${PBS_TIMEZONE:-UTC}
      PASSWORD: ${PBS_ROOT_PASSWORD:?PBS_ROOT_PASSWORD is required}

    ports:
      - "${PBS_BIND_IP:-127.0.0.1}:${PBS_PORT:-8007}:8007"

    tmpfs:
      - /run

    volumes:
      - ${PBS_CONFIG_PATH:-./config}:/etc/proxmox-backup
      - ${PBS_DATA_PATH:-./data}:/var/lib/proxmox-backup
      - ${PBS_DATASTORE_PATH:-./datastore}:/backups

    restart: always
    stop_grace_period: 2m

    labels:
      traefik.http.services.https-0-ylhchwpnkhnyxwzo4rs6bdho-pbs-f135.loadbalancer.server.scheme: "https"
      traefik.http.services.https-0-ylhchwpnkhnyxwzo4rs6bdho-pbs-f135.loadbalancer.serverstransport: "pbs-transport@file"
      coolify.traefik.middlewares: "homelab-pbs-allowlist@file"
