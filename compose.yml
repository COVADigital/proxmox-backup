
services:
  pbs:
    hostname: ${PBS_HOSTNAME:-pbs}
    image: "${PBS_IMAGE:-dockurr/proxmox-backup@sha256:fad1684971be96ba1600bf07e776a670ae80a76b2c99a6d396c167bb4de2444d}"

    environment:
      TZ: ${PBS_TIMEZONE:-UTC}
      PASSWORD: ${PBS_ROOT_PASSWORD:?PBS_ROOT_PASSWORD is required}

    ports:
      - "${PBS_BIND_IP:-127.0.0.1}:${PBS_PORT:-8007}:8007"

    tmpfs:
      - /run

    volumes:
      - type: bind
        source: ${PBS_CONFIG_PATH:-/srv/proxmox-backup/config}
        target: /etc/proxmox-backup
        bind:
          create_host_path: false

      - type: bind
        source: ${PBS_DATA_PATH:-/srv/proxmox-backup/data}
        target: /var/lib/proxmox-backup
        bind:
          create_host_path: false

      - type: bind
        source: /srv/proxmox-backup/datastore/pbs-storage
        target: /backups
        bind:
          create_host_path: false

    restart: always
    stop_grace_period: 2m

    labels:
      traefik.http.services.https-0-ylhchwpnkhnyxwzo4rs6bdho-pbs-f135.loadbalancer.server.scheme: "https"
      traefik.http.services.https-0-ylhchwpnkhnyxwzo4rs6bdho-pbs-f135.loadbalancer.serverstransport: "pbs-transport@file"
      coolify.traefik.middlewares: "homelab-pbs-allowlist@file"
