services:
  pbs:
    hostname: ${PBS_HOSTNAME:-pbs}
    image: ${PBS_IMAGE:-dockurr/proxmox-backup}

    environment:
      TZ: ${PBS_TIMEZONE:-UTC}
      PASSWORD: ${PBS_ROOT_PASSWORD:?PBS_ROOT_PASSWORD is required}

    ports:
      - "${PBS_BIND_IP:-127.0.0.1}:${PBS_PORT:-8007}:8007"

    tmpfs:
      - /run

    volumes:
      - ${PBS_CONFIG_PATH:-./config}:/etc/proxmox-backup
      - ${PBS_DATA_PATH:-./data}:/var/lib/proxmox-backup
      - ${PBS_DATASTORE_PATH:-./datastore}:/backups

    networks:
      - coolify

    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"

      # HTTPS router
      traefik.http.routers.pbs-secure.rule: "Host(`${PBS_DOMAIN}`)"
      traefik.http.routers.pbs-secure.entrypoints: "https"
      traefik.http.routers.pbs-secure.tls: "true"
      traefik.http.routers.pbs-secure.tls.certresolver: "letsencrypt"
      traefik.http.routers.pbs-secure.service: "pbs-backend"

      # Native HTTPS backend
      traefik.http.services.pbs-backend.loadbalancer.server.port: "8007"
      traefik.http.services.pbs-backend.loadbalancer.server.scheme: "https"
      traefik.http.services.pbs-backend.loadbalancer.serverstransport: "pbs-transport@file"

    restart: always
    stop_grace_period: 2m

networks:
  coolify:
    external: true
    name: coolify
